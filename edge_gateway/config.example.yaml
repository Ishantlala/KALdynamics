gateway:
  id: "GW-EDGE-04"
  plant_id: "BNG-PEENYA-PLANT-01"
  sampling_interval_ms: 250

mqtt:
  broker_host: "mqtt.fachealth.local"
  broker_port: 8883
  tls_enabled: true
  client_cert_path: "/etc/fachealth/certs/device.crt"
  client_key_path: "/etc/fachealth/certs/device.key"
  topic_prefix: "factory/telemetry"

local_anomaly_filter:
  vibration_mm_s_warn: 5.5
  temperature_c_warn: 80.0
  offline_buffer_path: "/var/lib/fachealth/buffer.sqlite"
  max_offline_hours: 48
